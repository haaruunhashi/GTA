<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blank City — Birmingham (Photorealistic 3D)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1017; font-family: "Segoe UI", Arial, sans-serif; color: #e8e4d8; }
  canvas { display: block; }
  /* Google requires the copyright attribution to be visible on screen at all times */
  #attribution { position: fixed; left: 0; right: 0; bottom: 0; padding: 4px 10px; z-index: 5;
    font: 11px/1.4 Arial, sans-serif; color: #fff; background: rgba(0,0,0,0.55);
    text-shadow: 0 1px 2px #000; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud { position: fixed; left: 12px; top: 12px; z-index: 5; font: 12px/1.6 monospace;
    background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px; }
  #hud b { color: #ffd23f; }
  #err { position: fixed; inset: 0; display: none; z-index: 20; align-items: center; justify-content: center;
    background: #12151d; padding: 40px; text-align: center; }
  #err div { max-width: 560px; font: 14px/1.7 monospace; color: #ffb4b4; }
  #err code { color: #8fd0ff; }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="hud">
  <div><b>BIRMINGHAM, UK</b> — photorealistic 3D</div>
  <div id="pos">loading tiles…</div>
  <div>WASD drive · Shift boost · Space brake · R reset</div>
</div>
<!-- mandatory Google attribution (populated live from the tileset) -->
<div id="attribution">Google</div>
<div id="err"><div id="errmsg"></div></div>

<!-- No bundler needed: map bare specifiers straight at the installed ESM builds.
     Serve the repo root over http (e.g. `npx serve .`) so /node_modules resolves. -->
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/webgpu": "/node_modules/three/build/three.webgpu.js",
    "three/tsl": "/node_modules/three/build/three.tsl.js",
    "three/addons/": "/node_modules/three/examples/jsm/",
    "three-mesh-bvh": "/node_modules/three-mesh-bvh/src/index.js",
    "3d-tiles-renderer": "/node_modules/3d-tiles-renderer/build/index.js",
    "3d-tiles-renderer/plugins": "/node_modules/3d-tiles-renderer/build/index.plugins.js",
    "3d-tiles-renderer/three": "/node_modules/3d-tiles-renderer/build/index.three.js",
    "3d-tiles-renderer/core": "/node_modules/3d-tiles-renderer/build/index.core.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GoogleTilesMap, BIRMINGHAM } from './map-google3d.js';
import { getApiKey } from './map-config.js';

const canvas = document.getElementById('map');
const attributionEl = document.getElementById('attribution');
const posEl = document.getElementById('pos');

function fail(html) {
  document.getElementById('errmsg').innerHTML = html;
  document.getElementById('err').style.display = 'flex';
}

const apiToken = getApiKey();
if (!apiToken) {
  fail('No Google Maps API key found.<br><br>Create <code>map-config.local.js</code> (git-ignored):<br><br>' +
       '<code>window.GOOGLE_MAPS_API_KEY = "YOUR_KEY";</code><br><br>' +
       'or append <code>?key=YOUR_KEY</code> to this URL for a quick local test.<br><br>' +
       'The key needs the <b>Map Tiles API</b> enabled and billing active.');
  throw new Error('missing API key');
}

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x3b3a34, 1.6));
const sun = new THREE.DirectionalLight(0xfff2d8, 2.2);
sun.position.set(-320, 620, 240);
scene.add(sun);

// 1. CAMERA INITIALISATION — starts above the Birmingham anchor looking down the street
const camera = new THREE.PerspectiveCamera(65, 1, 1, 12000);
camera.position.set(0, 180, 320);
camera.lookAt(0, 0, 0);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- 2/3/4/5: the Google photorealistic tileset ----------
let map;
try {
  map = new GoogleTilesMap({
    apiToken, scene, camera, renderer,
    origin: BIRMINGHAM,          // 52.4862, -1.8904
    attributionEl,               // mandatory credits
    physics: true,               // build BVH colliders from the streamed meshes
    errorTarget: 12
  });
} catch (e) {
  fail('Failed to start the tileset:<br><br><code>' + e.message + '</code>');
  throw e;
}
map.tiles.addEventListener('load-error', ev => {
  console.warn('tile load error', ev);
  fail('Google refused the tile request.<br><br>Check that: the key is valid, the <b>Map Tiles API</b> is enabled, ' +
       'billing is active, and the key\'s HTTP-referrer restriction allows this origin.');
});

// ---------- a simple vehicle driven on the real city surface ----------
const car = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.75, 4.4),
  new THREE.MeshStandardMaterial({ color: 0xd11f2a, metalness: 0.6, roughness: 0.28 }));
body.position.y = 0.75; car.add(body);
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.55, 2),
  new THREE.MeshStandardMaterial({ color: 0x0b111c, metalness: 0.9, roughness: 0.08 }));
cabin.position.set(0, 1.32, -0.2); car.add(cabin);
const wheels = [];
for (const [wx, wz] of [[1, 1.4], [-1, 1.4], [1, -1.4], [-1, -1.4]]) {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.3, 16),
    new THREE.MeshStandardMaterial({ color: 0x0c0d11, roughness: 0.85 }));
  w.rotation.z = Math.PI / 2; w.position.set(wx, 0.42, wz); car.add(w); wheels.push(w);
}
scene.add(car);

const V = { x: 0, y: 0, z: 0, yaw: 0, spd: 0, grounded: false };
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyR') { V.x = 0; V.z = 0; V.spd = 0; V.yaw = 0; } });
addEventListener('keyup', e => { keys[e.code] = false; });

let last = performance.now(), settleT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  // drive
  const accel = keys.ShiftLeft ? 26 : 15;
  if (keys.KeyW) V.spd += accel * dt;
  if (keys.KeyS) V.spd -= 18 * dt;
  if (keys.Space) V.spd -= V.spd * 2.4 * dt;
  V.spd -= V.spd * 0.55 * dt;
  V.spd = THREE.MathUtils.clamp(V.spd, -18, 68);
  const steer = ((keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0));
  V.yaw -= steer * 1.5 * dt * THREE.MathUtils.clamp(V.spd / 14, -1, 1);
  V.x += Math.sin(V.yaw) * V.spd * dt;
  V.z += Math.cos(V.yaw) * V.spd * dt;

  // 4. PHYSICS — stand on the real streamed geometry instead of falling through
  const g = map.getGroundHeight(V.x, V.z);
  if (g !== null) { V.y += (g - V.y) * Math.min(1, 12 * dt); V.grounded = true; }
  else { V.grounded = false; }   // tile not in yet: hold height rather than drop

  car.position.set(V.x, V.y, V.z);
  car.rotation.y = V.yaw;
  const spin = V.spd * dt / 0.42;
  for (const w of wheels) w.rotation.x -= spin;

  // chase camera
  const camTarget = new THREE.Vector3(
    V.x - Math.sin(V.yaw) * 12, V.y + 5.5, V.z - Math.cos(V.yaw) * 12);
  camera.position.lerp(camTarget, Math.min(1, 3.2 * dt));
  camera.lookAt(V.x, V.y + 1.4, V.z);

  map.update();

  settleT += dt;
  if (settleT > 0.25) {
    settleT = 0;
    const ll = map.localToLatLon(V.x, V.y, V.z);
    posEl.textContent =
      `lat ${ll.lat.toFixed(5)}  lon ${ll.lon.toFixed(5)}   ${Math.round(Math.abs(V.spd) * 2.237)} mph` +
      (V.grounded ? '' : '   [streaming…]');
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
